<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Microciclo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --paper:#EFF1F0; --surface:#FFFFFF; --sunk:#E4E8E6;
  --ink:#141A19; --muted:#5E6A67; --rule:#D3D8D6;
  --accent:#0B5D51; --accent-soft:#DCEAE6;
  --hot:#A8410F; --hot-soft:#F6E6DC;
  --cool:#6B7B76; --cool-soft:#E6EAE8;
  --warn:#8A6D1F; --warn-soft:#F3EDDC;
  --shadow:0 1px 2px rgba(20,26,25,.06),0 8px 24px rgba(20,26,25,.05);
  --btn-ink:#fff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1413; --surface:#161D1B; --sunk:#1D2624; --ink:#E4E8E6;
  --muted:#93A19D; --rule:#2A3532; --accent:#3FA593; --accent-soft:#12312B;
  --hot:#E5883F; --hot-soft:#34210F; --cool:#8B9A95; --cool-soft:#1D2624;
  --warn:#D6B45C; --warn-soft:#2C2413;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --btn-ink:#08110F;
}}
:root[data-theme="dark"]{
  --paper:#0F1413; --surface:#161D1B; --sunk:#1D2624; --ink:#E4E8E6;
  --muted:#93A19D; --rule:#2A3532; --accent:#3FA593; --accent-soft:#12312B;
  --hot:#E5883F; --hot-soft:#34210F; --cool:#8B9A95; --cool-soft:#1D2624;
  --warn:#D6B45C; --warn-soft:#2C2413;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --btn-ink:#08110F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,button,.ui{font-family:"Archivo","Helvetica Neue",Arial,sans-serif}
input,select,.mono,.tag,textarea{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 80px}
.hidden{display:none!important}

header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
  border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
.brand h1{font-size:clamp(24px,3.2vw,34px);font-weight:700;letter-spacing:-.02em;margin:0}
.brand .sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:5px}
.top .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.7}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);margin-bottom:22px}
.panel > .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:12px 15px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.hd h2{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.hd .note{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.panel > .bd{padding:15px}

.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media(min-width:1000px){.cols{grid-template-columns:380px minmax(0,1fr)}}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
label.f{display:flex;flex-direction:column;gap:5px}
label.f > span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--sunk);border:1px solid var(--rule);color:var(--ink);
  border-radius:2px;padding:7px 9px;font-size:13px;width:100%}
.g4 input,.g3 input{padding:6px 7px;font-size:12.5px;text-align:right}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}

.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;border:none;background:var(--sunk);color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--btn-ink)}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:9px 2px;border:1px solid var(--rule);background:var(--sunk);color:var(--muted);
  border-radius:2px;font-size:10.5px;font-weight:600;cursor:pointer;letter-spacing:.04em}
.days button[aria-pressed="true"]{background:var(--hot);color:#fff;border-color:var(--hot)}

button.go{width:100%;margin-top:16px;padding:12px;border:none;border-radius:2px;
  background:var(--accent);color:var(--btn-ink);cursor:pointer;font-size:11.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase}
button.go:hover{filter:brightness(1.12)}
button.go:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ghost{background:none;border:1px solid var(--rule);color:var(--muted);padding:7px 11px;
  border-radius:2px;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}

.roster{display:flex;flex-direction:column}
.rw{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--rule);cursor:pointer}
.rw:last-child{border-bottom:none}
.rw:hover{background:var(--sunk)}
.rw[aria-selected="true"]{background:var(--accent-soft)}
.rw .nm{font-family:"Archivo",sans-serif;font-weight:600;font-size:13.5px;flex:1}
.rw .dt{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}

.tag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
.t-hot{background:var(--hot-soft);color:var(--hot);box-shadow:inset 2px 0 0 var(--hot)}
.t-cool{background:var(--cool-soft);color:var(--cool);box-shadow:inset 2px 0 0 var(--cool)}
.t-warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 2px 0 0 var(--warn)}
.t-acc{background:var(--accent-soft);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}

.day{border-bottom:1px solid var(--rule)}
.day:last-child{border-bottom:none}
.dayhd{display:flex;align-items:baseline;gap:10px;padding:11px 15px 6px;flex-wrap:wrap}
.md{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  letter-spacing:.06em;color:var(--accent);min-width:46px}
.md.game{color:var(--hot)}
.dayname{font-family:"Archivo",sans-serif;font-weight:600;font-size:14px}
.quality{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);margin-left:auto}
.mins{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted)}

.ex{display:grid;grid-template-columns:44px 1fr auto;gap:3px 12px;align-items:start;
  padding:9px 15px;border-top:1px dotted var(--rule)}
.ex .fig{grid-row:span 2;width:44px;height:44px;color:var(--muted);opacity:.85}
.ex .nm{font-size:13.5px;font-family:"Source Serif 4",serif}
.ex .load{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);
  white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ex .cue{grid-column:2/-1;font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--muted);line-height:1.5}
.ex .cue b{color:var(--hot);font-weight:600}
/* Safety warnings must not read as coaching cues — own line, own colour, own mark */
.ex .warn{grid-column:2/-1;display:flex;gap:6px;align-items:flex-start;
  font-family:"IBM Plex Mono",monospace;font-size:10px;line-height:1.5;
  color:var(--warn);background:var(--warn-soft);border-left:2px solid var(--warn);
  padding:5px 8px;border-radius:0 2px 2px 0;margin-top:4px}
.ex .warn span:first-child{flex:none;font-weight:600}
.ex .nm a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
.ex .nm a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.ex .nm a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ex .play{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;
  border:1px solid var(--rule);border-radius:2px;padding:1px 4px;vertical-align:1px}
.ex .nm a:hover .play{border-color:var(--accent);color:var(--accent)}
.rowbtns{grid-column:3;display:flex;gap:4px;justify-content:flex-end;margin-top:4px}
.rowbtns button{background:none;border:1px solid var(--rule);color:var(--muted);
  border-radius:2px;cursor:pointer;font-size:9px;padding:2px 5px;line-height:1.4;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
.rowbtns button:hover{border-color:var(--accent);color:var(--accent)}
.ex.dropped{opacity:.4}
.ex.dropped .nm{text-decoration:line-through}
.rest{padding:10px 15px 12px 15px;font-size:13px;color:var(--muted);font-style:italic}

.strip{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.sb{flex:1 1 110px;padding:10px 14px;border-right:1px solid var(--rule)}
.sb:last-child{border-right:none}
.sb .k{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.sb .v{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.sb .n{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted);display:block;margin-top:2px}

.share{display:flex;gap:8px;align-items:center;padding:12px 15px;background:var(--sunk);
  border-top:1px solid var(--rule);flex-wrap:wrap}
.share input{flex:1;min-width:200px;font-size:11px}

.note-box{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 13px;
  margin:0 15px 15px;font-size:13px;color:var(--ink);border-radius:0 2px 2px 0}
.note-box.acc{border-color:var(--accent);background:var(--accent-soft)}
.note-box b{font-family:"Archivo",sans-serif}

.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
  line-height:1.75;max-width:78ch}
.foot b{color:var(--ink)}
@media print{body{background:#fff}.panel{box-shadow:none;break-inside:avoid}
  button,.share,.noprint{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ══════════════ COACH ══════════════ -->
<div class="wrap" id="coachView">
<header class="top">
  <div class="brand"><h1>Microciclo</h1>
    <div class="sub">Planificación semanal &middot; M5&ndash;M1</div></div>
  <div class="meta" id="coachMeta">v0.3</div>
</header>

<div class="cols">
  <div>
    <section class="panel">
      <div class="hd"><h2>Atletas</h2><span style="display:flex;gap:6px">
        <button class="ghost" id="lnkA" title="Enlace con toda tu lista">Enlace de respaldo</button>
        <button class="ghost" id="expA" title="Descargar copia de seguridad">Exportar</button>
        <button class="ghost" id="impA" title="Restaurar desde archivo">Importar</button>
        <button class="ghost" id="newA">+ Nuevo</button></span></div>
      <input type="file" id="impFile" accept="application/json" style="display:none">
      <div class="roster" id="roster"></div>
      <div class="share" id="backupBar" style="display:none">
        <input id="backupUrl" readonly>
        <button class="ghost" id="copyBackup">Copiar</button>
      </div>
    </section>

    <section class="panel" id="formPanel">
      <div class="hd"><h2>Datos</h2><span class="note" id="routeNote"></span></div>
      <div class="bd">
        <div class="seg" style="margin-bottom:14px">
          <button id="rGen" aria-pressed="true">Generalizado</button>
          <button id="rPro" aria-pressed="false">Con análisis</button>
        </div>

        <div class="g2">
          <label class="f"><span>Nombre</span><input id="fName" value="Jugador Nuevo"></label>
          <label class="f"><span>Edad</span><input id="fAge" class="num" type="number" min="10" max="45" value="18"></label>
          <label class="f"><span>Sexo</span><select id="fSex">
            <option value="m">Masculino</option><option value="f">Femenino</option></select></label>
          <label class="f"><span>Posición</span><select id="fPos"></select></label>
          <label class="f"><span>Estatura (cm)</span><input id="fHt" class="num" type="number" min="120" max="220" value="175"></label>
          <label class="f"><span>Peso (kg)</span><input id="fWt" class="num" type="number" min="30" max="150" value="71"></label>
          <label class="f"><span>Años entrenando</span><input id="fTa" class="num" type="number" min="0" max="20" value="2"></label>
          <label class="f"><span>Equipo disponible</span><select id="fTier">
            <option value="gym">Gimnasio completo</option>
            <option value="hotel">Mancuernas / bandas</option>
            <option value="bodyweight">Peso corporal</option></select></label>
          <label class="f"><span>Semana protocolo nórdico</span><select id="fNor">
            <option value="1">1 — 2×5, 1×sem</option>
            <option value="2">2 — 2×6, 2×sem</option>
            <option value="3">3 — 3×6-8, 3×sem</option>
            <option value="4">4 — 3×8-10, 3×sem</option>
            <option value="5">5+ — 3×12/10/8</option></select></label>
        </div>

        <div style="margin-top:14px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
            text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px">Días de partido</span>
          <div class="days" id="gameDays"></div>
        </div>

        <label style="display:flex;gap:9px;align-items:flex-start;margin-top:14px;cursor:pointer">
          <input type="checkbox" id="fProg" style="margin-top:3px">
          <span style="font-size:12.5px;line-height:1.45">
            <b style="font-family:'Archivo',sans-serif">Sobrecarga progresiva</b><br>
            <span style="color:var(--muted);font-size:11.5px">Sólo para atletas en recuperación o con déficit medido.
            Desactivado = plan de mantenimiento.</span></span>
        </label>

        <div id="proBlock" class="hidden">
          <div class="test" style="border-top:1px solid var(--rule);padding-top:13px;margin-top:15px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
              text-transform:uppercase;color:var(--muted)">CMJ bilateral &mdash; fuerza media propulsiva (N)</span>
            <div class="g3" style="margin-top:7px">
              <input class="num" id="cmjL0" placeholder="Izq 1"><input class="num" id="cmjL1" placeholder="Izq 2"><input class="num" id="cmjL2" placeholder="Izq 3">
              <input class="num" id="cmjR0" placeholder="Der 1"><input class="num" id="cmjR1" placeholder="Der 2"><input class="num" id="cmjR2" placeholder="Der 3">
            </div>
          </div>
          <div class="test" style="border-top:1px solid var(--rule);padding-top:13px;margin-top:13px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
              text-transform:uppercase;color:var(--muted)">NordBord &mdash; fuerza excéntrica (N)</span>
            <div class="g3" style="margin-top:7px">
              <input class="num" id="norL0" placeholder="Izq 1"><input class="num" id="norL1" placeholder="Izq 2"><input class="num" id="norL2" placeholder="Izq 3">
              <input class="num" id="norR0" placeholder="Der 1"><input class="num" id="norR1" placeholder="Der 2"><input class="num" id="norR2" placeholder="Der 3">
            </div>
          </div>
          <div class="g4" style="margin-top:13px">
            <label class="f"><span>Ecc H Izq</span><input id="ehL" class="num" type="number"></label>
            <label class="f"><span>Con Q Izq</span><input id="cqL" class="num" type="number"></label>
            <label class="f"><span>Ecc H Der</span><input id="ehR" class="num" type="number"></label>
            <label class="f"><span>Con Q Der</span><input id="cqR" class="num" type="number"></label>
          </div>
          <div class="g4" style="margin-top:9px">
            <label class="f"><span>10 m (s)</span><input id="s10" class="num" step="0.01" type="number"></label>
            <label class="f"><span>20 m (s)</span><input id="s20" class="num" step="0.01" type="number"></label>
            <label class="f"><span>30 m (s)</span><input id="s30" class="num" step="0.01" type="number"></label>
            <label class="f"><span>Sent. 1RM</span><input id="sq1rm" class="num" type="number"></label>
          </div>
          <div class="note-box acc" style="margin:13px 0 0;font-size:12px">
            Referencia individual de partido &mdash; mediana de 3&ndash;5 partidos completos.
            Sin esto, los porcentajes de carga no significan nada.
          </div>
          <div class="g4" style="margin-top:9px">
            <label class="f"><span>Dist. tot (m)</span><input id="refDist" class="num" type="number"></label>
            <label class="f"><span>HSR (m)</span><input id="refHsr" class="num" type="number"></label>
            <label class="f"><span>Sprint (m)</span><input id="refSpr" class="num" type="number"></label>
            <label class="f"><span>Acc+Dec</span><input id="refAcc" class="num" type="number"></label>
          </div>
        </div>

        <button class="go" id="gen">Generar semana</button>
        <button class="ghost" id="delA" style="width:100%;margin-top:8px">Eliminar atleta</button>
      </div>
    </section>
  </div>

  <div>
    <section class="panel" id="outPanel">
      <div class="hd"><h2>Semana</h2><span class="note" id="wkNote"></span></div>
      <div class="strip" id="strip"></div>
      <div id="notes"></div>
      <div id="week"></div>
      <div class="share">
        <input id="shareUrl" readonly placeholder="Genera la semana para crear el enlace">
        <button class="ghost" id="copyBtn">Copiar enlace</button>
        <button class="ghost" id="printBtn">Imprimir</button>
      </div>
    </section>
  </div>
</div>
<div class="foot" id="foot"></div>
</div>

<!-- ══════════════ ATHLETE ══════════════ -->
<div class="wrap hidden" id="athView">
  <header class="top">
    <div class="brand"><h1 id="avName">&nbsp;</h1><div class="sub" id="avSub">&nbsp;</div></div>
    <div class="meta noprint">
      <div class="seg" style="min-width:230px">
        <button data-tier="gym" class="tierBtn">Gimnasio</button>
        <button data-tier="hotel" class="tierBtn">Hotel</button>
        <button data-tier="bodyweight" class="tierBtn">Sin equipo</button>
      </div>
    </div>
  </header>
  <div class="panel"><div id="avWeek"></div></div>
  <div class="foot" id="avFoot"></div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const nv=id=>{const e=$(id);if(!e)return 0;const v=parseFloat(e.value);return isFinite(v)?v:0;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DAYS=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const DAYSL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

/* ───────────── figures ───────────── */
const FIG={
 squat:'<circle cx="24" cy="9" r="4"/><path d="M24 13v9l-7 7v9M24 22l7 7v9M17 38h-4M31 38h4M14 20h20"/>',
 hinge:'<circle cx="15" cy="12" r="4"/><path d="M19 14l12 5M31 19v10M31 29v9M27 38h8M31 19l-8 3M23 22l-4 16"/>',
 lunge:'<circle cx="24" cy="9" r="4"/><path d="M24 13v11M24 24l-8 8v6M24 24l8 6v8M12 38h8M28 38h8"/>',
 bridge:'<circle cx="11" cy="30" r="4"/><path d="M15 30h9l6-8 6 8M36 30v6M30 22v-6M13 36h26"/>',
 jump:'<circle cx="24" cy="10" r="4"/><path d="M24 14v10M24 24l-5 8M24 24l5 8M18 16l-6-4M30 16l6-4"/><path d="M24 40v4M20 41l4 4 4-4" opacity=".55"/>',
 bound:'<circle cx="16" cy="11" r="4"/><path d="M16 15v9l-4 8M16 24l8 5v9M20 38h8M8 32h6"/><path d="M34 20h8M38 16l4 4-4 4" opacity=".55"/>',

function ageBand(a){
  if(a<16) return {k:"u16",rir:4,ecc:false,maxInt:"moderate",
    note:"Menor de 16: técnica y dominio del peso corporal. Sin excéntrico máximo ni cargas altas."};
  if(a<19) return {k:"u19",rir:3,ecc:true,maxInt:"high",
    note:"16&ndash;18: se introduce carga progresiva. El excéntrico se progresa despacio."};
  if(a<30) return {k:"adult",rir:2,ecc:true,maxInt:"high",note:""};
  return {k:"vet",rir:3,ecc:true,maxInt:"high",
    note:"30+: se prioriza recuperación. Menos volumen, misma intensidad."};
}
function trainBand(t){
  /* reps use a literal en dash — these strings are escaped on the athlete's
     side, so an HTML entity here would render as visible markup */
  if(t<1) return {rirAdj:1,sets:2,reps:"10–12",
    note:"Menos de 1 año entrenando: patrones básicos antes que carga."};
  if(t<3) return {rirAdj:0,sets:3,reps:"8–10",note:""};
  return {rirAdj:0,sets:3,reps:"5–8",note:""};
}

/* Map each weekday to its match-day label.
   A day is simultaneously MD+n of the last match and M-n of the next.
   Close to the previous match, recovery binds; otherwise the next match binds. */
function mdMap(gameDays){
  const out=[];
  for(let d=0;d<7;d++){
    if(gameDays.includes(d)){out.push({d,md:"MD",game:true});continue;}
    let fwd=99,back=99;
    for(const g of gameDays){
      const f=(g-d+7)%7; if(f>0&&f<fwd) fwd=f;
      const b=(d-g+7)%7; if(b>0&&b<back) back=b;
    }
    let md,focus;
    if(back===1){ md="MD+1"; focus="recover"; }
    else if(back===2&&fwd>=4){ md="MD+2"; focus="deep"; }
    else { const n=Math.min(fwd,5); md="M"+n; focus=QUAL["M"+n].focus; }
    out.push({d,md,focus,game:false,fwd,back});
  }
  return out;
}

 M1:{es:"Activación",focus:"primer"},
 M2:{es:"Descarga y velocidad breve",focus:"taper"},
 M3:{es:"Especificidad y velocidad",focus:"speed"},
 M4:{es:"Fuerza y carga mecánica",focus:"strength"},
 M5:{es:"Compensar o desarrollar",focus:"recover"}
};

function pickFor(focus,prof,band,tier,sex,proFlags){
  const need=id=>{const e=byId(id);return e&&e.tiers[tier];};
  /* Three tiers of priority. The minute budget fills `must` before `core`
     and `core` before `extra`, so protective work is never what gets cut
     when the session runs long — that was backwards in the first version. */
  let must=[], core=[], extra=[];

  if(focus==="recover"){ core=["bike","mobility","hamiso","balance"]; }
  if(focus==="deep")   { core=["mobility","row","pushup","deadbug"]; extra=["soleus"]; }
  if(focus==="strength"){
    /* Eccentric knee-flexor work is the highest-value prevention item in
       soccer, so it is budgeted before the barbell work, not after. */
    if(band.ecc) must.push("nordic");
    core=["back-squat","bulgara","rdl","hipthrust"];
    extra=["copen","carry","calf"];
  }
  if(focus==="speed"){
    must=[prof.speed>=3?"sprint":"sled"];
    core=["askip","bound","slrdl"];
    extra=["row","calf"];
  }
  if(focus==="taper") { core=["askip","pogo","cmj"]; extra=["pallof","deadbug"]; }
  if(focus==="primer"){ core=["rondo","cmj","askip"]; extra=["balance"]; }

  if(prof.jump>=3&&focus==="strength")     core.splice(2,0,"box-jump");
  if(prof.cod>=3&&focus==="speed")         core.splice(1,0,"lateral-lunge");
  if(prof.hsr>=3&&focus==="speed")         core.push("accel");
  if(prof.strength>=3&&focus==="strength") core.splice(1,0,"trapbar");
  /* Female athletes: landing mechanics and hip control. Added exposure,
     never a replacement for the base session. */
  if(sex==="f"&&focus==="strength") core.splice(1,0,"lateral-walk","bound");
  /* A measured deficit outranks everything else on the day. */
  if(proFlags.ham&&(focus==="strength"||focus==="recover")) must.unshift("nordic","slrdl");
  if(proFlags.limb&&focus==="strength") must.unshift("bulgara");

  let ids=[...must,...core,...extra];

  if(!band.ecc) ids=ids.filter(i=>i!=="nordic");
  ids=[...new Set(ids)].filter(need).filter(i=>{
    const e=byId(i);
    const label=focus==="game"?"MD":Object.keys(QUAL).find(k=>QUAL[k].focus===focus);
    return !label||label==="MD"||e.md.includes(label);
  });
  return ids.map(byId);
}

function doseFor(e,band,tr,prog,prof,proFlags){
  const rir=clamp(band.rir+tr.rirAdj,1,4);
  let sets=tr.sets, reps=tr.reps, extra="";
  if(e.int==="high"&&band.maxInt!=="high") sets=Math.max(2,sets-1);
  if(e.pat==="jump"||e.pat==="bound") return {load:`${sets} × 5`,detail:`Descanso 60 s`};
  if(e.id==="sprint") return {load:`${clamp(prof.speed+2,3,6)} × 20 m`,detail:"Descanso completo 3 min"};
  if(e.id==="sled")   return {load:`${clamp(prof.speed+3,4,6)} × 15 m`,detail:"Descanso 90 s"};
  if(e.id==="bike")   return {load:"12 min",detail:"Conversacional"};
  if(e.id==="rondo")  return {load:"8 min",detail:"Volumen bajo"};
  if(e.id==="mobility")return{load:"6 min",detail:"Sin prisa"};
  if(e.pat==="brace"||e.pat==="isometric")
    return {load:`${sets} × ${e.uni?"25 s/lado":"30 s"}`,detail:"Calidad sobre tiempo"};
  if(e.id==="nordic"){
    const n=nordicDose(proFlags.nordicWk);
    return {load:`${n.sets} × ${n.reps}`,
      detail:`Semana ${n.wk} del protocolo · ${n.freq}×/sem · bajada lenta, nunca al fallo`};
  }
  if(prog){sets+=1;extra=" · +1 serie (sobrecarga activa)";}
  if(proFlags.limb&&e.uni) extra=` · lado ${proFlags.limbSide} +1 serie`;
  return {load:`${sets}${e.uni?"/lado":""} × ${reps}`,detail:`RIR ${rir}${extra}`};
}

/* ───────────── pro gate (retained) ───────────── */
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sdev=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1));};
function gateOne(pfx){
  const L=[0,1,2].map(i=>nv(pfx+"L"+i)), R=[0,1,2].map(i=>nv(pfx+"R"+i));
  if(L.some(v=>v<=0)||R.some(v=>v<=0)) return null;
  const mL=mean(L),mR=mean(R);
  const cvv=((sdev(L)/mL)+(sdev(R)/mR))/2*100;
  const hi=Math.max(mL,mR),lo=Math.min(mL,mR);
  const asym=(hi-lo)/hi*100;
  const side=mL<mR?"izquierdo":"derecho";
  if(cvv>10) return {v:"descartado",asym,cvv,side};
  if(asym<=cvv) return {v:"ruido",asym,cvv,side};
  return {v:"real",asym,cvv,side};
}

/* ───────────── build week ───────────── */
function build(a){
  const prof=POS[a.pos], band=ageBand(a.age), tr=trainBand(a.ta);
  const map=mdMap(a.games);
  const proFlags={ham:false,limb:false,limbSide:"",nordicWk:a.nor||1};
  const gates=[];
  if(a.route==="pro"){
    const c=gateOne("cmj"), n=gateOne("nor");
    if(c){gates.push({n:"CMJ fuerza propulsiva",...c}); if(c.v==="real"){proFlags.limb=true;proFlags.limbSide=c.side;}}
    if(n){gates.push({n:"NordBord excéntrico",...n}); if(n.v==="real"){proFlags.ham=true;if(!proFlags.limb){proFlags.limb=true;proFlags.limbSide=n.side;}}}
    const hqL=nv("cqL")>0?nv("ehL")/nv("cqL"):0, hqR=nv("cqR")>0?nv("ehR")/nv("cqR"):0;
    if(hqL&&hqR){
      const lo=Math.min(hqL,hqR), sd=hqL<hqR?"izquierdo":"derecho";
      gates.push({n:"Ratio H:Q funcional",v:lo<1?"real":"ruido",asym:lo,cvv:null,side:sd,ratio:true});
      if(lo<1) proFlags.ham=true;
    }
  }
  const days=map.map(m=>{
    if(m.game) return {md:"MD",day:DAYSL[m.d],q:"Partido",game:true,ex:[],
      rest:"Día de partido. Sin trabajo complementario."};
    const picks=pickFor(m.focus,prof,band,a.tier,a.sex,proFlags);
    let budget=45, ex=[], seen=new Set();
    for(const e of picks){
      /* two exercises can collapse to the same movement once substituted
         down an equipment tier — keep only the first */
      const resolved=e.tiers[a.tier]||e.es;
      if(seen.has(resolved)) continue;
      if(budget-e.min<0) continue;
      seen.add(resolved); budget-=e.min;
      const d=doseFor(e,band,tr,a.prog,prof,proFlags);
      ex.push({id:e.id,pat:e.pat,es:e.es,tiers:e.tiers,load:d.load,detail:d.detail,
        cue:e.cue,caution:e.caution||"",min:e.min});
    }
    /* Coach overrides are applied after generation so the engine stays the
       source of truth and an edit never silently changes another day. */
    const ed=(a.edits&&a.edits[m.md])||{};
    ex=ex.filter(x=>!(ed[x.id]&&ed[x.id].drop));
    ex=ex.map(x=>{
      const o=ed[x.id]; if(!o) return x;
      if(o.swap){
        const t=byId(o.swap);
        if(t){ const d2=doseFor(t,band,tr,a.prog,prof,proFlags);
          return {id:t.id,pat:t.pat,es:t.es,tiers:t.tiers,load:o.load||d2.load,
                  detail:d2.detail+" · cambiado",cue:t.cue,caution:t.caution||"",min:t.min}; }
      }
      return o.load?{...x,load:o.load,detail:x.detail+" · ajustado"}:x;
    });
    return {md:m.md,day:DAYSL[m.d],q:FOCUSNAME[m.focus],game:false,ex,
            mins:Math.max(8,ex.reduce((t,x)=>t+x.min,0)+8)};
  });
  return {a,days,gates,band,tr,proFlags};
}

/* ───────────── share encode ───────────── */
function enc(o){
  const s=JSON.stringify(o);
  const b=new TextEncoder().encode(s);
  let bin="";b.forEach(c=>bin+=String.fromCharCode(c));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function dec(t){
  try{
    let b=t.replace(/-/g,"+").replace(/_/g,"/");
    while(b.length%4)b+="=";
    const bin=atob(b);const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(arr));
  }catch(e){return null;}
}

/* Row controls in the generated week. Delegated so regenerating the week
   does not need to rebind anything. */
$("week").addEventListener("click",ev=>{
  const b=ev.target.closest("button[data-act]"); if(!b||sel===null) return;
  const a=store[sel]; if(!a) return;
  const {act,day,ex}=b.dataset;
  a.edits=a.edits||{}; a.edits[day]=a.edits[day]||{};
  const cur=a.edits[day][ex]=a.edits[day][ex]||{};
  const e=byId(ex);

  if(act==="drop"){
    cur.drop=!cur.drop;
  }
  if(act==="load"){
    const v=prompt(`Carga para ${e?e.es:ex} en ${day}`,cur.load||"");
    if(v===null) return;
    if(v.trim()==="") delete cur.load; else cur.load=v.trim().slice(0,40);
  }
  if(act==="vid"){
    const v=prompt(`Liga del video para ${e?e.es:ex}
(deja vacío para volver al predeterminado)`,
      OVERRIDES[ex]||"");
    if(v===null) return;
    const t=v.trim();
    if(!t){ delete OVERRIDES[ex]; }
    else if(/^https?:\/\//i.test(t)){ OVERRIDES[ex]=t; }
    else { alert("La liga debe empezar con http:// o https://"); return; }
    saveOverrides();
  }
  if(act==="swap"){
    /* Only offer exercises legal for this day, so an edit cannot put
       high-eccentric work next to the match. */
    const legal=BANK.filter(x=>x.id!==ex&&(day.startsWith("MD")||x.md.includes(day)));
    const NL=String.fromCharCode(10);
    const list=legal.map((x,i)=>`${i+1}. ${x.es}`).join(NL);
    const pick=prompt(`Cambiar ${e?e.es:ex} por:

${list}

Número (vacío = deshacer)`,"");
    if(pick===null) return;
    if(pick.trim()===""){ delete cur.swap; }
    else{
      const n=parseInt(pick,10);
      if(!(n>=1&&n<=legal.length)){ alert("Número fuera de rango."); return; }
      cur.swap=legal[n-1].id;
    }
  }
  if(!cur.drop&&!cur.load&&!cur.swap) delete a.edits[day][ex];
  save(); renderCoach();
});
$("expA").onclick=()=>{
  const blob=new Blob([JSON.stringify({v:1,atletas:store},null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="microciclo-atletas.json";
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$("lnkA").onclick=()=>{
  if(!store.length){alert("Agrega al menos un atleta primero.");return;}
  const u=location.origin+location.pathname+"#r="+enc({v:1,atletas:store});
  $("backupUrl").value=u; $("backupBar").style.display="flex"; $("backupUrl").select();
};
$("copyBackup").onclick=()=>{
  const i=$("backupUrl"); if(!i.value) return;
  i.select(); navigator.clipboard.writeText(i.value).then(()=>{
    $("copyBackup").textContent="Copiado"; setTimeout(()=>$("copyBackup").textContent="Copiar",1600);});
};
$("impA").onclick=()=>$("impFile").click();
$("impFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const list=Array.isArray(d)?d:d.atletas;
      if(!Array.isArray(list)) throw new Error("formato");
      /* Merge by name so re-importing a backup does not duplicate a roster. */
      let added=0,updated=0;
      list.forEach(a=>{
        if(!a||!a.name) return;
        const i=store.findIndex(x=>x.name===a.name);
        if(i>=0){store[i]=a;updated++;} else {store.push(a);added++;}
      });
      save(); sel=null; drawRoster();
      alert(`Importado: ${added} nuevo(s), ${updated} actualizado(s).`);
    }catch(err){ alert("Ese archivo no es una copia válida de Microciclo."); }
    e.target.value="";
  };
  rd.readAsText(f);
};
$("copyBtn").onclick=()=>{const i=$("shareUrl");if(!i.value)return;
  i.select();navigator.clipboard.writeText(i.value).then(()=>{
    $("copyBtn").textContent="Copiado";setTimeout(()=>$("copyBtn").textContent="Copiar enlace",1600);});};
$("printBtn").onclick=()=>window.print();

function route_(){
  const h=location.hash;
  if(h.startsWith("#r=")){
    const d=dec(h.slice(3));
    const list=d&&(Array.isArray(d)?d:d.atletas);
    if(Array.isArray(list)&&list.length){
      /* Merge rather than replace — opening a backup link on a device that
         already has athletes must not wipe them. */
      let added=0,updated=0;
      list.forEach(a=>{
        if(!a||!a.name) return;
        const i=store.findIndex(x=>x.name===a.name);
        if(i>=0){store[i]=a;updated++;}else{store.push(a);added++;}
      });
      save(); drawRoster();
      history.replaceState(null,"",location.pathname);
      alert(`Lista cargada: ${added} nuevo(s), ${updated} actualizado(s).`);
    } else alert("Ese enlace de respaldo no se pudo leer.");
    return;
  }
  if(!h.startsWith("#a=")) return;
  const p=dec(h.slice(3));
  if(p&&p.d&&p.d.length){ showAthlete(p); return; }
  /* A broken or truncated link must not drop an athlete into the coach tool. */
  $("coachView").classList.add("hidden");
  $("athView").classList.remove("hidden");
  $("avName").textContent="Enlace no válido";
  $("avSub").textContent="";
  $("avWeek").innerHTML='<div class="rest">Este enlace está incompleto o vencido. '+
    'Pídele a tu entrenador que te lo mande otra vez — a veces se corta al copiarlo.</div>';
  $("avFoot").textContent="";
}
route_();
/* Hash-only navigation does not reload the page, so re-route on change. */
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
